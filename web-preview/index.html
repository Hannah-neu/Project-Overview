 }else{let controls=selectControl('component','零部件',['injector','Pump','Rail','ECU','DNOX'],component);if(component.size)rows=rows.filter(r=>[...component].some(name=>val(r[name]).toUpperCase()==='Y'));$('#content').innerHTML=`<div class="panel"><div class="panelhead"><div><h2>新发布零部件</h2><span class="muted">${rows.length} 行</span></div>${controls}</div>${table(rows,[['项目 ID',r=>r['PRJ MCR-ID']],['项目名称',r=>r['PRJ name']],['项目经理',r=>r['Project manager']],['组件',r=>r.Components],['新发布组件',r=>r['New released components']],['QGC0 计划',r=>fmt(r['QGC0 plan'])],['QGC4 计划',r=>fmt(r['QGC4 plan'])],['状态',r=>r['PRJ Status']]])}</div>`}bindLocal();bindGantt();document.querySelectorAll('.project-open').forEach(button=>button.onclick=()=>{detailIndex=Number(button.dataset.projectIndex);render();window.scrollTo({top:0,behavior:'smooth'})})}
// Close an open filter when focus moves to the surrounding page.
document.addEventListener('click',event=>{if(event.target instanceof Element&&event.target.closest('.multi'))return;document.querySelectorAll('.multi[open]').forEach(menu=>{menu.open=false});openFilter=''});
document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;const menu=document.querySelector('.multi[open]');if(!menu)return;menu.open=false;openFilter='';menu.querySelector('summary')?.focus();event.preventDefault()});
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{appView=button.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===appView);b.setAttribute('aria-current',b.dataset.view===appView?'page':'false')});$('#overview-view').hidden=appView!=='overview';$('#settings-view').hidden=appView!=='settings';if(appView==='overview')render()});
$('#reset').onclick=()=>{Object.values(selections).forEach(x=>x.clear());manager.clear();year.clear();component.clear();search='';openFilter='';selectedCustomer=selectedSegment=selectedProduct='';render()};let importGeneration=0;
function applyDataset(body){dataset=body;detailIndex=null;timelineView=null;selectedCustomer=selectedSegment=selectedProduct='';manager.clear();year.clear();component.clear();openFilter='';loadFilters();let warnings=Object.values(body.issues).reduce((a,b)=>a+b,0);$('#notice').textContent=`已导入 ${body.source.filename} · ${body.summary.project_rows} 条项目行 · ${body.summary.milestone_rows} 条里程碑行 · ${warnings} 个源错误或日期问题。读取保存值，不刷新外部链接。项目页按 Power BI 排除 END、Hold、LOST，且仅保留 QGC4 Act 为空的行。`;document.querySelector('.demo').textContent='● 已导入数据';render()}
async function responseData(response){let text=await response.text(),body;try{body=JSON.parse(text)}catch{if(response.status===404)throw new Error('本地服务版本较旧，请关闭旧服务并重新启动项目概览');throw new Error('本地服务返回了无法识别的响应，请重启服务后重试')}if(!response.ok)throw new Error(body.error||'文件读取失败');return body}
$('#upload').onclick=()=>$('#file').click();$('#file').accept='.xlsx,.csv';$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let generation=++importGeneration,notice=$('#notice'),button=$('#upload');button.disabled=true;notice.textContent=`正在读取 ${f.name}…`;try{let form=new FormData();form.append('file',f);let response=await fetch('/api/import',{method:'POST',body:form});let body=await responseData(response);if(generation===importGeneration)applyDataset(body)}catch(err){if(generation===importGeneration)notice.textContent=`导入失败：${err.message}。${dataset?'继续显示上次成功导入的数据。':'请选择有效文件。'}`}finally{button.disabled=false;e.target.value=''}};render();
