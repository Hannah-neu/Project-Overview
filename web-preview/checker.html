<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Check</title>
<style>
:root{font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;color:#1c3032;background:#f0f3ef;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#123c3a;color:#fff;padding:24px max(6vw,28px);display:flex;justify-content:space-between;align-items:center}header strong{font-size:16px;letter-spacing:.08em}header span{font-size:12px;color:#b4cebf;letter-spacing:.12em}main{max-width:1160px;margin:auto;padding:64px 28px 90px}.eyebrow{color:#34836d;font-size:12px;font-weight:800;letter-spacing:.18em}h1{font-size:clamp(34px,5vw,56px);letter-spacing:-.04em;margin:14px 0 12px;line-height:1.1}p{line-height:1.7;color:#647673}.intro{max-width:680px;font-size:16px}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;margin-top:42px;align-items:start}.panel{background:#fff;border:1px solid #d9e3dc;border-radius:5px;padding:26px;min-width:0}.panel h2{font-size:17px;margin:0 0 8px}.upload{display:block;width:100%;border:1px dashed #8ab2a1;background:#f4f9f5;text-align:center;padding:28px 16px;margin:22px 0 16px;cursor:pointer;overflow-wrap:anywhere}.upload:hover,.upload.drag{background:#e7f4e9;border-color:#167b5c}.icon{display:block;font-size:32px;color:#267b60}.upload b{display:block;margin:9px 0}.upload small{display:block;color:#768b82}.button{border:0;background:#157258;color:#fff;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer;width:100%}.button:hover{background:#0f5b46}.button:disabled{opacity:.45;cursor:default}.note{font-size:12px;margin:18px 0 0}.results-head{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #e3ebe5;padding-bottom:18px}.count{font-size:12px;color:#668075;overflow-wrap:anywhere}.empty{padding:72px 18px;text-align:center;color:#8b9b91}.empty strong{display:block;color:#3b5550;margin-bottom:8px}.row{display:grid;grid-template-columns:86px 1fr;gap:16px;padding:19px 0;border-bottom:1px solid #edf1ed}.row:last-child{border:0}.badge{font-size:11px;font-weight:800;text-align:center;align-self:start;padding:6px 4px;border-radius:2px}.pass{background:#e5f3e9;color:#17643d}.missing{background:#fae9e6;color:#a53429}.review{background:#fff2d9;color:#8c5a04}.na{background:#edf1ef;color:#6c7e75}.row h3{font-size:15px;margin:2px 0 5px}.row p{font-size:13px;margin:0}.pages{display:block;color:#287458;font-size:12px;font-weight:700;margin-top:7px}.alert{background:#fff5df;border-left:3px solid #db9e35;color:#6c561e;padding:12px 16px;font-size:13px;margin-top:20px;line-height:1.6}.filename{overflow-wrap:anywhere;color:#214f40}.error{color:#a53429;font-size:13px}@media(max-width:760px){main{padding-top:40px}.layout{grid-template-columns:minmax(0,1fr)}header span{display:none}}

@font-face{font-family:bosch;src:url(https://brandguide-cdn.azureedge.net/fonts/BoschSans-Regular.woff2);font-display:swap}@font-face{font-family:bosch;src:url(https://brandguide-cdn.azureedge.net/fonts/BoschSans-Bold.woff2);font-weight:700;font-display:swap}:root{font-family:bosch,"Microsoft YaHei",sans-serif;background:#f7f9fc;color:#1c2c40;font-size:14px}main{max-width:none;margin:0;padding:10px 2px 24px}h1{font-size:26px;letter-spacing:0;margin:7px 0 8px}.eyebrow{color:#287986;font-size:11px}.intro{margin:0;color:#718095;font-size:13px}.layout{grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:16px;margin-top:20px}.panel{border:1px solid #e6eaf0;border-radius:15px;box-shadow:0 2px 10px rgba(32,53,76,.035);padding:20px}.panel h2{color:#2b4156;font-size:15px}.upload{border-radius:10px;background:#f7fbfb;border-color:#a5c7c8;padding:20px 12px}.upload:hover,.upload.drag{background:#eaf7f7;border-color:#247986}.button{border-radius:9px;background:#226c7a;padding:12px 16px}.button:hover{background:#1a5d69}.row{grid-template-columns:80px 1fr;padding:14px 0;border-color:#edf1f5}.badge{border-radius:5px}.results-head{border-color:#edf1f5}.empty{padding:50px 16px}@media(max-width:760px){main{padding:8px 0 20px}.layout{grid-template-columns:minmax(0,1fr)}}

/* Increase contrast for the imported file and check results. */
.count,.filename,.row p{color:#344d59}.pages{color:#246d62}

/* Darker file information and result details. */
.count,.filename,.row p{color:#1b3043}

/* Compact exception-first checker results. */
.results-head{padding-bottom:11px}.row{grid-template-columns:72px minmax(0,1fr);gap:11px;padding:9px 0}.row h3{font-size:14px;line-height:1.25;margin:0 0 3px}.row p{font-size:12px;line-height:1.4}.badge{font-size:10px;padding:4px 5px}.pages{font-size:11px;margin-top:3px}.alert{margin-top:10px;padding:9px 12px}.no-issues{color:#477267;font-size:13px;padding:14px 0}.confirmed-results{margin-top:12px;border-top:1px solid #e6eaf0}.confirmed-results>summary{cursor:pointer;list-style:none;color:#247986;font-size:12px;font-weight:700;padding:11px 0}.confirmed-results>summary::-webkit-details-marker{display:none}.confirmed-results>summary::before{content:"▸";display:inline-block;margin-right:7px}.confirmed-results[open]>summary::before{content:"▾"}.confirmed-list{border-top:1px solid #edf1f5}

.prc-help{margin-top:9px;border:1px solid #dce8ed;border-radius:8px;background:#f7fafb;color:#1b3043}
.prc-help>summary{cursor:pointer;padding:9px 11px;color:#176775;font-size:12px;font-weight:700}
.prc-help-body{border-top:1px solid #e3ebef;padding:10px 12px;font-size:12px;line-height:1.5}
.prc-help-body p{margin:0 0 9px}.prc-help-body ul{padding-left:18px;margin:8px 0}.prc-help-body li{margin:3px 0}
.prc-help-body h4{margin:12px 0 5px;font-size:12px}.prc-help-body .prc-help-source{color:#60798c;margin:8px 0 0}

.prc-template-path{margin:10px 0;overflow-wrap:anywhere}.prc-template-path a{color:#176775}.prc-template-path code{font:inherit}.prc-guide-image{display:block;width:100%;height:auto;border:1px solid #dce8ed;border-radius:5px;background:white;margin:12px 0}

.prc-copy-path{border:0;background:none;color:#176775;cursor:pointer;font:inherit;text-decoration:underline;margin-left:10px;padding:0}

.prc-copy-feedback{display:inline-block;margin-left:8px;color:#315e62}.prc-copy-manual{display:block;box-sizing:border-box;width:100%;min-height:60px;margin-top:8px;font:inherit}.prc-copy-manual[hidden]{display:none}

.prc-guide-image{width:min(100%, 720px)}

/* A compact navigation list remains available beside expanded check results. */
.results-layout{display:grid;grid-template-columns:minmax(150px,205px) minmax(0,1fr);gap:16px;align-items:start}
.results-layout:has(.result-nav[hidden]){grid-template-columns:minmax(0,1fr)}
.result-nav{position:sticky;top:10px;max-height:calc(100vh - 28px);overflow-y:auto;min-width:0;padding:12px 9px;border-right:1px solid #e6eaf0}
.result-nav[hidden]{display:none}.result-nav-title{padding:2px 8px 8px;color:#718397;font-size:11px;font-weight:700}
.result-nav-item{display:flex;align-items:flex-start;gap:7px;width:100%;padding:7px 8px;border:0;border-radius:6px;background:transparent;color:#31495f;font:inherit;font-size:12px;line-height:1.35;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.result-nav-item:hover,.result-nav-item.active{background:#e8f4f4;color:#176775}.result-nav-item:focus-visible{outline:2px solid #25818c;outline-offset:-2px}
.result-nav-dot{flex:0 0 7px;width:7px;height:7px;border-radius:50%;margin-top:5px;background:#94a4b2}.result-nav-dot.missing{background:#c53d36}.result-nav-dot.review{background:#cf8921}.result-nav-dot.pass{background:#25835e}
#result{min-width:0}.row{scroll-margin-top:10px}
@media(max-width:760px){.results-layout{grid-template-columns:minmax(110px,145px) minmax(0,1fr);gap:8px}.result-nav{padding-left:0;padding-right:5px}.result-nav-item{font-size:11px;padding:6px 4px}}
</style></head><body><main><h1 id="checker-title">Document Check</h1><p class="intro" id="checker-intro"></p><div class="layout"><section class="panel"><h2 id="choose-title"></h2><p id="choose-hint"></p><label class="upload" id="drop"><span class="icon">↥</span><b id="fileLabel"></b><small id="drop-hint"></small><input id="file" type="file" accept="application/pdf,.pdf" hidden></label><button class="button" id="run" disabled></button><p id="error" class="error" role="alert"></p><p class="note" id="checker-note"></p></section><section class="panel"><div class="results-head"><div><h2 id="results-title"></h2><span class="count" id="summary"></span></div><span class="eyebrow">REVIEW</span></div><div class="results-layout"><nav id="result-nav" class="result-nav" aria-label="Check items" hidden></nav><div id="result" aria-live="polite"></div></div></section></div></main><script>
const input=document.querySelector('#file'),drop=document.querySelector('#drop'),run=document.querySelector('#run'),result=document.querySelector('#result'),summary=document.querySelector('#summary'),error=document.querySelector('#error'),label=document.querySelector('#fileLabel'),hint=document.querySelector('#drop-hint'),resultNav=document.querySelector('#result-nav');
let selected=null,lastData=null,lastName='',lastError='',busy=false,checkedOnce=false,confirmedOpen=false,lang='en';try{if(localStorage.getItem('workspace-language')==='zh')lang='zh'}catch(_){}
const text=(en,zh)=>lang==='zh'?zh:en;
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const namesZh={'PRC / Project Summary':'PRC / 项目摘要','Project time schedule':'项目时间计划','R&D Sheet':'研发页','Profitability data with history':'含历史记录的盈利数据','Decision sheet':'决议页','Effort Tracking':'工时跟踪','oneQ cover page':'oneQ 封面','System assessment':'系统评估（图表、关键问题跟踪、签字页）','Risk management report':'风险管理报告','Last decision minutes':'上次会议决议','PMP / APIC':'PMP / APIC','oneQ rating consistency':'oneQ 评级一致性'};
const detailMap={'PRC identified; standard document checks are enabled.':'识别到 PRC，已启用标准文件检查。','PRC not identified. Confirm manually whether the standard document checks apply.':'未识别到 PRC，请人工确认标准文件检查是否适用。','Project time schedule not found. Use the MS Project time schedule.':'未找到项目时间计划，请使用 MS Project 时间计划。','Risk Report title found, but the magenta logo at the upper left could not be identified. Review manually.':'找到 Risk Report 标题，但未能识别左上角玫红色标志，请人工复核。','Risk Report title and magenta logo at the upper left found.':'找到 Risk Report 标题及左上角玫红色标志。','A matching page was found.':'已找到符合特征的页面。','No page matched all features. Check for missing documents or review manually.':'未找到符合全部特征的页面，请确认文件是否缺失或人工复核。','No previous corrective-actions page was found; this check does not apply.':'未发现上次决议整改页，此条件不适用。','APIC is E; no additional PMP reminder is required.':'APIC 为 E，无需额外提醒补充 PMP。','APIC / PIC could not be read reliably. Confirm manually whether PMP is required.':'无法可靠读取 APIC / PIC，请人工确认是否需要 PMP。','A unique oneQ cover page was not found. Confirm the correspondence manually.':'未找到唯一的 oneQ 封面，请人工确认对应关系。'};
function detailZh(s){if(detailMap[s])return detailMap[s];let m;if((m=s.match(/^At least 2 Decision sheet pages are required; (\d+) found\.$/)))return `需要至少 2 页 Decision sheet，当前找到 ${m[1]} 页。`;if((m=s.match(/^APIC is (.+); A page contains both MP-201\.01-102-PS and Project Management Plan, indicating that PMP material was provided\.$/)))return `APIC 为 ${m[1]}；检测到同一页包含 MP-201.01-102-PS 和 Project Management Plan，认为 PMP 材料已补充。`;if((m=s.match(/^APIC is (.+); PMP material is required\. No page contains both MP-201\.01-102-PS and Project Management Plan; provide it or verify manually\.$/)))return `APIC 为 ${m[1]}，需要补充 PMP；未找到同时包含 MP-201.01-102-PS 和 Project Management Plan 的页面，请补充或人工确认。`;if((m=s.match(/^The color or current rating could not be reliably identified \(PRC: (.+); oneQ: (.+)\)\. Review manually\.$/)))return `无法可靠识别颜色或评级（PRC：${m[1]==='unidentified'?'未识别':m[1]}；oneQ：${m[2]==='unidentified'?'未识别':m[2]}），请人工核对。`;if((m=s.match(/^PRC: (.+) \(source: (.+)\); oneQ Overall rating: (.+); the current assessments yield (.+) using red > yellow > green\. (.+)$/)))return `PRC：${m[1]}（识别来源：${m[2]==='label'?'标签':'三色块列首项'}）；oneQ 总体评级：${m[3]}；各项当前评估按红 > 黄 > 绿得到 ${m[4]}。${m[5].startsWith('Ratings are consistent')?'评级一致。':'评级不一致，请核查。'}`;return s}
function errorText(s){if(lang!=='zh')return s;const map={'Select a PDF no larger than 60 MB.':'请选择不超过 60 MB 的 PDF。','The file is not a valid PDF.':'文件不是有效的 PDF。','PyMuPDF is required for PDF checks. Install it and restart the service.':'缺少 PyMuPDF，请安装后重启服务。','PDF check failed. Check whether the file is damaged or password protected.':'PDF 检查失败，请确认文件未损坏或受密码保护。','The PDF is encrypted. Remove password protection before checking.':'PDF 已加密，请先解除密码保护。','The PDF exceeds 500 pages. Split it before checking.':'PDF 超过 500 页，请拆分后检查。','Cannot connect to the local service. Ensure the Workspace service is running, then refresh and try again.':'无法连接本地服务，请确认 Workspace 服务正在运行并刷新页面。','The check failed. Verify that the PDF is not damaged.':'检查失败，请确认 PDF 未损坏。'};return map[s]||s}
function renderChecker(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelector('#checker-title').textContent=text('Document Check','文档检查');document.querySelector('#checker-intro').textContent=text('Upload meeting materials to check PRC and PET standard documents.','上传会议材料，检查 PRC 与 PET 标准文件。');document.querySelector('#choose-title').textContent=text('Select meeting document','选择会议文件');document.querySelector('#choose-hint').textContent=text('One PDF file, up to 60 MB.','支持单个 PDF，最大 60 MB。');document.querySelector('#checker-note').textContent=text('Only extractable PDF text is checked. Scanned images and unrecognized colors require manual review.','仅检查可提取的 PDF 文字；扫描图片或无法识别的颜色需要人工复核。');document.querySelector('#results-title').textContent=text('Check results','检查结果');label.textContent=selected?selected.name:text('Select or drop a PDF','点击选择或拖入 PDF');label.classList.toggle('filename',!!selected);hint.textContent=selected?text('Select or drop another PDF to replace this file','点击或拖入新的 PDF 以更换文件'):'PDF DOCUMENT';run.textContent=busy?text('Checking...','正在检查…'):checkedOnce?text('Run again →','重新检查 →'):text('Run check →','开始检查 →');run.disabled=busy||!selected;input.disabled=busy;drop.style.pointerEvents=busy?'none':'';error.textContent=errorText(lastError);
 if(lastData){let previous=result.querySelector('details.confirmed-results');if(previous)confirmedOpen=previous.open;let counts={pass:0,missing:0,review:0,na:0};for(const r of lastData.results)counts[r.status]++;summary.textContent=lang==='zh'?`${lastName} · ${lastData.total} 页 · 通过 ${counts.pass} / 异常 ${counts.missing} / 待复核 ${counts.review}`:`${lastName} · ${lastData.total} pages · Passed ${counts.pass} / Issues ${counts.missing} / Review ${counts.review}`;const names=lang==='zh'?{pass:'已找到',missing:'异常',review:'待复核',na:'不适用'}:{pass:'Found',missing:'Issue',review:'Review',na:'Not applicable'},order={missing:0,review:1,pass:2,na:3};const row=r=>`<div class="row" id="check-item-${lastData.results.indexOf(r)}"><span class="badge ${escapeHTML(r.status)}">${escapeHTML(names[r.status]||r.status)}</span><div><h3>${escapeHTML(r.name)}</h3><p>${escapeHTML(lang==='zh'?detailZh(r.detail):r.detail)}</p>${r.pages.length?`<span class="pages">${lang==='zh'?'第 '+r.pages.join('、')+' 页':'Page(s) '+r.pages.join(', ')}</span>`:''}</div></div>`;const ordered=[...lastData.results].sort((a,b)=>(order[a.status]??4)-(order[b.status]??4));const attention=ordered.filter(r=>r.status!=='pass'&&r.status!=='na'),confirmed=ordered.filter(r=>r.status==='pass'||r.status==='na');resultNav.hidden=ordered.length===0;resultNav.innerHTML=`<div class="result-nav-title">${text('Check items','检查项')}</div>${ordered.map(r=>`<button type="button" class="result-nav-item" data-check-index="${lastData.results.indexOf(r)}"><span class="result-nav-dot ${escapeHTML(r.status)}" aria-label="${escapeHTML(names[r.status]||r.status)}"></span><span>${escapeHTML(r.name)}</span></button>`).join('')}`;const reviewAlert=lastData.textless.length?`<div class="alert">${escapeHTML(lang==='zh'?`第 ${lastData.textless.join('、')} 页可提取文字很少，可能含扫描图片；请人工检查。本工具不提供 OCR。`:`Page(s) ${lastData.textless.join(', ')} contain little extractable text and may include scanned images. Review them manually; this tool does not perform OCR.`)}</div>`:'';result.innerHTML=(attention.length?attention.map(row).join(''):`<div class="no-issues">${text('No issues or items marked for review.','没有异常或标记为待复核的项目。')}</div>`)+reviewAlert+(confirmed.length?`<details class="confirmed-results" ${confirmedOpen?'open':''}><summary>${text('Show confirmed / not applicable','展开已找到 / 不适用')} (${confirmed.length})</summary><div class="confirmed-list">${confirmed.map(row).join('')}</div></details>`:'');let details=result.querySelector('details.confirmed-results');if(details)details.addEventListener('toggle',()=>{confirmedOpen=details.open});resultNav.querySelectorAll('[data-check-index]').forEach(button=>button.addEventListener('click',()=>{let target=document.getElementById('check-item-'+button.dataset.checkIndex);if(!target)return;let group=target.closest('details.confirmed-results');if(group){group.open=true;confirmedOpen=true}resultNav.querySelectorAll('.result-nav-item').forEach(item=>item.classList.toggle('active',item===button));target.scrollIntoView({behavior:'smooth',block:'start'});}));}
 else{resultNav.hidden=true;resultNav.innerHTML='';summary.textContent=selected?text('File selected; ready to check','已选择文件，等待检查'):text('Waiting for a file','等待上传文件');result.innerHTML=`<div class="empty"><strong>${text('Ready to check','准备好开始检查')}</strong>${selected?text('Select Run check to view the results.','点击“开始检查”查看结果。'):text('Results and page numbers will appear here.','结果将在这里逐项显示，并标注页码。')}</div>`}}
function choose(f){if(!f||busy)return;selected=f;lastData=null;lastError='';checkedOnce=false;confirmedOpen=false;renderChecker()}
input.onchange=()=>{choose(input.files[0]);input.value=''};for(const type of ['dragenter','dragover'])drop.addEventListener(type,e=>{e.preventDefault();drop.classList.add('drag')});for(const type of ['dragleave','drop'])drop.addEventListener(type,e=>{e.preventDefault();drop.classList.remove('drag')});drop.addEventListener('drop',e=>choose(e.dataTransfer.files[0]));
run.onclick=async()=>{if(!selected||busy)return;const checked=selected;busy=true;lastError='';renderChecker();try{const response=await fetch('/checker/analyze',{method:'POST',headers:{'Content-Type':'application/pdf'},body:checked});const data=await response.json();if(!response.ok)throw new Error(data.error);lastData=data;lastName=checked.name;checkedOnce=true}catch(e){lastError=e instanceof TypeError?'Cannot connect to the local service. Ensure the Workspace service is running, then refresh and try again.':(e.message||'The check failed. Verify that the PDF is not damaged.')}finally{busy=false;renderChecker()}};
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='workspace-language'||!['en','zh'].includes(event.data.language))return;lang=event.data.language;renderChecker()});renderChecker();
</script></body></html>
